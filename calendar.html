<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>July 18, 2026 Calendar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.45), transparent 25%),
    radial-gradient(circle at 80% 30%, rgba(255,192,203,.5), transparent 30%),
    radial-gradient(circle at 50% 90%, rgba(255,105,180,.45), transparent 35%),
    linear-gradient(
        135deg,
        #ffd1e6,
        #ff8fbd,
        #ff4f91
    );

    font-family:'Segoe UI',sans-serif;

    position:relative;
}

/* floating hearts */
.heart{
    position:fixed;

    color:#ff2d75;

    font-size:22px;

    text-shadow:
        0 0 8px #ff4f91,
        0 0 18px #ff6ea8,
        0 0 30px rgba(255,79,145,.8);

    animation:float 8s linear infinite;

    opacity:.65;

    pointer-events:none;

    z-index:1;   /* Behind the calendar */
}

@keyframes float{

    0%{
        transform:
            translateY(110vh)
            translateX(0)
            rotate(0deg)
            scale(.6);

        opacity:0;
    }

    10%{
        opacity:.7;
    }

    50%{
        transform:
            translateY(50vh)
            translateX(20px)
            rotate(180deg)
            scale(1);
    }

    100%{
        transform:
            translateY(-15vh)
            translateX(-20px)
            rotate(360deg)
            scale(1.3);

        opacity:0;
    }

}


.calendar{
    width:330px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.3);

    animation:open 1.5s ease;

    position:relative;
    z-index:10;   /* Calendar stays above hearts */
}


@keyframes open{
    0%{
        transform:rotateX(90deg) scale(.5);
        opacity:0;
    }

    100%{
        transform:rotateX(0) scale(1);
        opacity:1;
    }
}



.header{
    background:#ff4f91;
    color:white;
    text-align:center;
    padding:25px;
}


.header h1{
    font-size:35px;
}


.header p{
    font-size:18px;
}


.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    padding:15px;
    text-align:center;
    font-weight:bold;
    color:#ff4f91;
}


.date{
    padding:12px;
}


.special{

    background:#ff4f91;
    color:white;

    border-radius:50%;

    animation:
        heartBeat 1s infinite,
        glowPink 2s infinite;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.25);
    }

}

@keyframes glowPink{

    50%{

        box-shadow:
        0 0 15px #ff4f91,
        0 0 35px #ff77b7,
        0 0 70px #ffb6d9;

    }

}


.message{
    text-align:center;
    padding:20px;
    font-size:20px;
    color:#ff4f91;
    font-family:cursive;
}

/* ===========================
   Continue Container
=========================== */

.continue-container{
    position:fixed;
    left:50%;
    bottom:45px;
    transform:translateX(-50%) scale(.5);
    opacity:0;
    transition:1s ease;
    pointer-events:none;
}

.continue-container.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
    pointer-events:auto;
}

/* ===========================
   Button
=========================== */

.continue-btn{

    position:relative;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:18px 45px;

    border-radius:60px;

    text-decoration:none;

    color:white;
    font-size:20px;
    font-weight:bold;

    background:linear-gradient(135deg,#ff7eb3,#ff4f91);

    box-shadow:
    0 10px 30px rgba(255,79,145,.45),
    0 0 40px rgba(255,79,145,.35);

    overflow:hidden;

    animation:
    floating 3s ease-in-out infinite,
    glow 2s infinite;
}

/* glossy shine */

.continue-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.9),
        transparent
    );

    transform:skewX(-25deg);

    animation:shine 3s infinite;
}

.continue-btn:hover{

    transform:scale(1.08);

}

/* ===========================
   Sparkles
=========================== */

.sparkles::before,
.sparkles::after{

    content:"✨";

    position:absolute;

    color:white;
    font-size:25px;

    animation:sparkle 2s infinite;
}

.sparkles::before{

    left:-35px;
    top:-10px;

}

.sparkles::after{

    right:-35px;
    bottom:-10px;

    animation-delay:1s;
}

/* ===========================
   Hearts
=========================== */

.continue-container::before,
.continue-container::after{

    content:"❤";

    position:absolute;

    color:#ff5d9f;

    font-size:18px;

    animation:heartFloat 2.5s infinite ease-in-out;
}

.continue-container::before{

    left:-18px;
    bottom:15px;

}

.continue-container::after{

    right:-18px;
    bottom:15px;

    animation-delay:1.2s;
}

/* ===========================
   Animations
=========================== */

@keyframes glow{

    50%{

        box-shadow:
        0 0 20px #ff4f91,
        0 0 40px #ff7eb3,
        0 0 70px #ff9fc8;

    }

}

@keyframes floating{

    0%,100%{

        transform:translateY(0);

    }

    50%{

        transform:translateY(-8px);

    }

}

@keyframes shine{

    from{

        left:-120%;

    }

    to{

        left:140%;

    }

}

@keyframes sparkle{

    0%{

        transform:scale(.5);
        opacity:0;

    }

    50%{

        transform:scale(1.4);
        opacity:1;

    }

    100%{

        transform:scale(.5);
        opacity:0;

    }

}

@keyframes heartFloat{

    0%{

        transform:translateY(0) scale(.6);
        opacity:0;

    }

    40%{

        opacity:1;

    }

    100%{

        transform:translateY(-35px) scale(1.2);
        opacity:0;

    }

}

.year-box{
    width:120px;
    height:40px;
    margin:auto;
    overflow:hidden;
    border-radius:12px;
    background:rgba(255,255,255,.2);
}

.year-strip{
    transition:4s cubic-bezier(.15,.9,.2,1);
}

.year-strip div{
    height:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    color:white;
}

</style>

</head>

<body>


<div class="calendar">

<div class="header">
    <h1>July</h1>

    <div class="year-box">
        <div class="year-strip" id="yearStrip">
            <div>2019</div>
            <div>2020</div>
            <div>2021</div>
            <div>2022</div>
            <div>2023</div>
            <div>2024</div>
            <div>2025</div>
            <div>2026</div>
        </div>
    </div>
</div>


<div class="days">

<div>Sun</div>
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>


<!-- July 2026 starts Wednesday -->

<div></div>
<div></div>
<div></div>

<div class="date">1</div>
<div class="date">2</div>
<div class="date">3</div>
<div class="date">4</div>

<div class="date">5</div>
<div class="date">6</div>
<div class="date">7</div>
<div class="date">8</div>
<div class="date">9</div>
<div class="date">10</div>
<div class="date">11</div>

<div class="date">12</div>
<div class="date">13</div>
<div class="date">14</div>
<div class="date">15</div>
<div class="date">16</div>
<div class="date">17</div>

<div class="date" id="special18">18</div>

<div class="date">19</div>
<div class="date">20</div>
<div class="date">21</div>
<div class="date">22</div>
<div class="date">23</div>
<div class="date">24</div>
<div class="date">25</div>

<div class="date">26</div>
<div class="date">27</div>
<div class="date">28</div>
<div class="date">29</div>
<div class="date">30</div>
<div class="date">31</div>

</div>


<div class="message">
❤️ Our Special Day ❤️
</div>

<!-- Continue Button -->
<div class="continue-container" id="continueContainer">
    <div class="sparkles"></div>

    <a href="continue.html" class="continue-btn">
        ❤ Continue ❤
    </a>
</div>

</div>


<script>

// floating hearts

function createHeart(){

let heart=document.createElement("div");

heart.className="heart";
const hearts = ["❤","💕","💖","💗","💓","💞"];
heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

heart.style.fontSize = (16 + Math.random() * 18) + "px";

heart.style.left=Math.random()*100+"%";
heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);


setTimeout(()=>{
heart.remove();
},8000);

}


setInterval(createHeart,500);

// Show button after 3 seconds
const yearStrip=document.getElementById("yearStrip");
const special=document.getElementById("special18");
const continueBtn=document.getElementById("continueContainer");

// Wait a little after calendar opens
setTimeout(()=>{

    // Scroll to 2026
    yearStrip.style.transform="translateY(-280px)";

},1000);


// Highlight July 18
setTimeout(()=>{

    special.classList.add("special");

},5200);


// Show Continue button
setTimeout(()=>{

    continueBtn.classList.add("show");

},7000);

</script>


</body>
</html>
