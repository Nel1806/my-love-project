<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phone Photo Strip Design</title>

<style>
:root {
  --bg-image: url('images/continuebg.png');

  --photo-1: url('images/bg1.jpeg');
  --photo-2: url('images/bg2.jpeg');
  --photo-3: url('images/bg3.jpeg');

  --photo-4: url('images/bg4.jpeg');
  --photo-5: url('images/bg5.jpeg');
  --photo-6: url('images/bg6.jpeg');

  --photo-7: url('images/bg7.jpeg');
  --photo-8: url('images/bg8.jpeg');
  --photo-9: url('images/bg9.jpeg');
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  position: relative;
  overflow: hidden;
  font-family: sans-serif;
}

/* BACKGROUND */
.bg {
  position: absolute;
  inset: 0;
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
}

/* DARK OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(90,40,40,0.55),
    rgba(120,55,55,0.45),
    rgba(90,40,40,0.55)
  );
}

/* MAIN STAGE */
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6vw;
  flex-wrap: wrap;
}

/* STRIP */
.strip {
  position: relative;
  width: 130px;
  height: 320px;
  background: #fdfaf2;
  border-radius: 6px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  padding: 6px;
  gap: 4px;
}

.strip.tall {
  height: 360px;
  transform: translateY(-10px);
}

/* PHOTO CELLS */
.cell {
  flex: 1;
  border-radius: 2px;
  background-size: cover;
  background-position: center;
}

/* FLOWERS */
.flower {
  position: absolute;
  width: 46px;
  height: 46px;
  z-index: 2;
}

.sun-top    { top: -14px; left: -16px; }
.sun-bottom { bottom: -14px; left: -16px; }
.daisy-mid  { right: -22px; top: 50%; transform: translateY(-50%); }
.flower-mid { right: -22px; top: 50%; transform: translateY(-50%); }
.flower-right-bottom { bottom: -14px; right: -16px; }

.back-btn{
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;

  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  text-decoration: none;

  /* STRONG PINK GRADIENT */
  background: linear-gradient(135deg, #ff2e7a, #ff7fb3, #ff1f6d);

  color: white;
  font-size: 22px;
  font-weight: bold;

  border: 2px solid rgba(255,255,255,0.6);

  box-shadow:
    0 0 10px rgba(255, 0, 100, 0.8),
    0 0 25px rgba(255, 0, 100, 0.6),
    0 0 45px rgba(255, 0, 100, 0.4);

  transition: 0.25s ease;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="stage">

  <!-- STRIP 1 -->
  <div class="strip">
    <div class="cell" style="background-image: var(--photo-1);"></div>
    <div class="cell" style="background-image: var(--photo-2);"></div>
    <div class="cell" style="background-image: var(--photo-3);"></div>
  </div>

  <!-- STRIP 2 -->
  <div class="strip tall">
    <div class="cell" style="background-image: var(--photo-4);"></div>
    <div class="cell" style="background-image: var(--photo-5);"></div>
    <div class="cell" style="background-image: var(--photo-6);"></div>
  </div>

  <!-- STRIP 3 -->
  <div class="strip">
    <div class="cell" style="background-image: var(--photo-7);"></div>
    <div class="cell" style="background-image: var(--photo-8);"></div>
    <div class="cell" style="background-image: var(--photo-9);"></div>
  </div>

</div>

<a href="javascript:history.back()" class="back-btn" aria-label="Go back">←</a>

</body>
</html>
