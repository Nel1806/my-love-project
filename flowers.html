<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Something for You</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* ---- swap these paths for your own files ---- */
  --bg-image: url('images/continuebg.png');
  --video-poster: url('images/continuebg.png');

  /* palette */
   --wine:#f5075f;
  --deep-rose:#cb0d50;
  --charcoal-wine:#b00b5e;
  --gold:#f0c869;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width:100%;
    height:100%;
    min-height:100%;
    overflow:hidden;
    background:#000;
}

.frame-inner video {
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

/* ===================== BACKGROUND ===================== */
.bg {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 15%, rgba(255,61,127,0.35), transparent 55%),
    radial-gradient(circle at 85% 80%, rgba(240,200,105,0.18), transparent 50%),
    linear-gradient(160deg, var(--wine) 0%, var(--deep-rose) 45%, #2c0c1c 100%);
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(74,20,40,0.78),
    rgba(110,31,58,0.55) 40%,
    rgba(74,20,40,0.85)
  );
  backdrop-filter: blur(1px);
}

/* soft vignette to draw eye to center */
.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, transparent 35%, rgba(30,6,15,0.65) 100%);
  pointer-events: none;
}

/* ===================== STAGE ===================== */
.stage{
    position: relative;
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 18px;
    padding: 20px;
}

.eyebrow {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(28px, 5vw, 44px);
  color: var(--gold);
  text-shadow: 0 0 18px rgba(240,200,105,0.55);
  letter-spacing: 0.5px;
  animation: floatText 4s ease-in-out infinite;
}

@keyframes floatText {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* ===================== VIDEO FRAME ===================== */
.frame-wrap {
  position: relative;
  padding: 14px;
  border-radius: 22px;
  background: linear-gradient(135deg, #ffe1ea, #ff8fb3 35%, #ff3d7f 65%, #c81a5c);
  box-shadow:
    0 0 25px rgba(255, 61, 127, 0.65),
    0 0 55px rgba(255, 61, 127, 0.45),
    0 0 90px rgba(255, 61, 127, 0.25),
    0 20px 60px rgba(0,0,0,0.5);
  animation: glowPulse 3.2s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% {
    box-shadow:
      0 0 25px rgba(255, 61, 127, 0.65),
      0 0 55px rgba(255, 61, 127, 0.45),
      0 0 90px rgba(255, 61, 127, 0.25),
      0 20px 60px rgba(0,0,0,0.5);
  }
  50% {
    box-shadow:
      0 0 35px rgba(255, 61, 127, 0.9),
      0 0 75px rgba(255, 61, 127, 0.65),
      0 0 120px rgba(255, 61, 127, 0.4),
      0 20px 60px rgba(0,0,0,0.5);
  }
}

@media (max-width: 768px){

    .stage{
        gap: 12px;
        padding: 16px;
    }

    .eyebrow{
        font-size: 26px;
    }

    .back-btn{
        margin-top: 10px;
        width: 46px;
        height: 46px;
    }

}

.frame-inner{
    position: relative;
    width: min(90vw, 900px);
    aspect-ratio: 16 / 9;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    border-radius: 12px;
    background: #000;
}

.frame-inner video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
}

/* corner flourishes */
.corner {
  position: absolute;
  width: 34px;
  height: 34px;
  z-index: 3;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
}
.corner svg { width: 100%; height: 100%; }
.corner.tl { top: -6px; left: -6px; transform: rotate(0deg); }
.corner.tr { top: -6px; right: -6px; transform: scaleX(-1); }
.corner.bl { bottom: -6px; left: -6px; transform: scaleY(-1); }
.corner.br { bottom: -6px; right: -6px; transform: scale(-1,-1); }

/* orbiting hearts around the frame */
.orbit-heart {
  position: absolute;
  font-size: 20px;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(240, 5, 5, 0.8);
  animation: orbitPulse 2.6s ease-in-out infinite;
}
.orbit-heart.a { top: -18px; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
.orbit-heart.b { bottom: -18px; left: 50%; transform: translateX(-50%); animation-delay: 0.8s; }
.orbit-heart.c { top: 50%; left: -18px; transform: translateY(-50%); animation-delay: 1.3s; }
.orbit-heart.d { top: 50%; right: -18px; transform: translateY(-50%); animation-delay: 1.9s; }

@keyframes orbitPulse {
  0%, 100% { opacity: 0.55; transform-origin: center; filter: brightness(1); }
  50% { opacity: 1; filter: brightness(1.3); }
}

.caption {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(18px, 3vw, 24px);
  color: var(--blush);
  text-align: center;
  max-width: 320px;
  opacity: 0.9;
}

/* ===================== SOUND PROMPT ===================== */
.sound-prompt {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  background: rgba(20, 4, 10, 0.38);
  backdrop-filter: blur(1px);
  cursor: pointer;
  transition: opacity 0.4s ease;
}

.sound-prompt.hidden {
  opacity: 0;
  pointer-events: none;
}

.sound-icon {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ff2e7a, #ff7fb3);
  box-shadow: 0 0 18px rgba(255,61,127,0.85), 0 0 34px rgba(255,61,127,0.5);
  font-size: 20px;
  animation: soundPulse 1.6s ease-in-out infinite;
}

@keyframes soundPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.sound-label {
  font-family: 'Dancing Script', cursive;
  font-size: 17px;
  color: var(--cream);
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
}

/* small persistent mute toggle once sound is on */
.mute-toggle {
  position: absolute;
  bottom: 10px;
  right: 10px;
  z-index: 6;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(20,4,10,0.55);
  border: 1px solid rgba(255,255,255,0.5);
  color: var(--cream);
  font-size: 15px;
  cursor: pointer;
}

.mute-toggle.visible {
  display: flex;
}

.fullscreen-toggle{
    position:absolute;
    bottom:10px;
    left:10px;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:50%;
    cursor:pointer;

    background:rgba(20,4,10,.55);
    border:1px solid rgba(255,255,255,.5);

    color:white;
    font-size:16px;

    transition:.25s;
}

.fullscreen-toggle:hover{
    transform:scale(1.08);
    background:rgba(255,61,127,.8);

    
}

.fullscreen-toggle{
    display:none;
}

/* ===================== FLOATING HEARTS (ambient) ===================== */
.hearts-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.heart{
    position:absolute;
    bottom:-50px;

    color:#ff003c;
    opacity:0.9;

    text-shadow:
        0 0 8px #ff003c,
        0 0 20px #ff3366;

    animation: riseFade linear infinite;
}





@keyframes riseFade {
  0% {
    transform: translateY(0) translateX(0) rotate(0deg) scale(1);
    opacity: 0;
  }
  10% { opacity: 0.85; }
  50% {
    transform: translateY(-50vh) translateX(var(--drift, 20px)) rotate(15deg) scale(1.05);
  }
  90% { opacity: 0.6; }
  100% {
    transform: translateY(-105vh) translateX(calc(var(--drift, 20px) * -1)) rotate(-10deg) scale(0.9);
    opacity: 0;
  }
}

/* ===================== SPARKLES ===================== */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 6px 2px rgba(240,200,105,0.9);
  animation: twinkle 2.4s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(0.6); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* ===================== BACK BUTTON ===================== */
.back-btn{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
 background:rgba(245,7,95,.45);
  border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  font-size:18px;
  text-decoration:none;
  z-index:5;
  transition:background .2s ease, transform .2s ease;
}

.back-btn:hover{
  background:rgba(187, 27, 120, 0.3);
  transform:translateX(-50%) translateY(-3px);
}


/* ===================== ARRIVAL CURTAIN ===================== */
/* This page loads with the curtain shut, then opens to reveal it.
   Restyled to match this page's rose/wine/gold palette instead of
   the pink-stripe version used on the gift-picker page. */
.flower-curtain{
  position:fixed;
  top:0;
  width:50%;
  height:100vh;
  z-index:9999;
  pointer-events:none;

  /* fabric folds — same wine/rose/gold weave used on the
     destination pages so the curtain reads as one continuous
     piece of fabric across the close → open transition */
  background:
    linear-gradient(90deg, rgba(255,255,255,0.06) 0px, transparent 3px) repeat-x,
    repeating-linear-gradient(
      90deg,
      var(--wine) 0px,
      var(--deep-rose) 16px,
      var(--charcoal-wine) 32px
    );

  box-shadow: inset 0 0 140px rgba(0,0,0,0.55);

  /* resting/default state = fully open, with the same slow,
     smooth easing used for the arrival open on the destination
     pages — one simple motion, no wave/skew */
  transform: scaleX(0);
  transition: transform 1.6s cubic-bezier(.16,.84,.44,1);

  overflow:hidden;
}

/* LEFT SIDE */
.flower-curtain.left{
  left:0;
  transform-origin:left;
}

/* RIGHT SIDE */
.flower-curtain.right{
  right:0;
  transform-origin:right;
}

/* CLOSE — click-triggered. Just transitions to scaleX(1). */
.flower-curtain.active{
  transform: scaleX(1);
}

/* ✨ center glow seam — gold, matching the destination pages */
.flower-curtain::after{
  content:"";
  position:absolute;
  top:0;
  width:70px;
  height:100%;
  opacity:0.6;
  background: radial-gradient(circle, rgba(240,200,105,0.25), transparent);
}

/* seam position */
.flower-curtain.left::after{ right:0; }
.flower-curtain.right::after{ left:0; }

/* ✨ light shimmer moving */
.flower-curtain::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:60%;
  height:100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(240,200,105,0.18),
    transparent
  );
  animation: shine 2s infinite;
}

@keyframes shine {
  0% { left:-120%; }
  100% { left:120%; }
}

/* ==========================================================
   Arrival state — page loads with the curtain already shut,
   then opens to reveal the content underneath.
   ========================================================== */

/* Put class="curtain-preclosed" on <body> for any page that
   should load "behind closed curtains". No transition here — it
   snaps to the closed frame instantly on paint, no flash of the
   open page first. */
body.curtain-preclosed .flower-curtain{
  transform: scaleX(1) !important;
  transition: none !important;
}

/* continue.js swaps curtain-preclosed → curtain-opening shortly
   after load. Same simple scaleX transition as the close — one
   motion, played in the direction each page needs. */
body.curtain-opening .flower-curtain{
  transform: scaleX(0) !important;
  transition: transform 1.6s cubic-bezier(.16,.84,.44,1) !important;
}
</style>
</head>

<body class="curtain-preclosed">

<div class="flower-curtain left"></div>
<div class="flower-curtain right"></div>

<div class="bg"></div>
<div class="overlay"></div>
<div class="vignette"></div>

<div class="hearts-layer" id="heartsLayer"></div>

<div class="stage">

  <div class="eyebrow">For you, Lablab &#10084;</div>

  <div class="frame-wrap">
    <div class="corner tl"><svg viewBox="0 0 34 34"><path d="M2 32 C2 14 14 2 32 2" stroke="#fff" stroke-width="2" fill="none" opacity="0.9"/><circle cx="6" cy="28" r="2.4" fill="#f0c869"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 34 34"><path d="M2 32 C2 14 14 2 32 2" stroke="#fff" stroke-width="2" fill="none" opacity="0.9"/><circle cx="6" cy="28" r="2.4" fill="#f0c869"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 34 34"><path d="M2 32 C2 14 14 2 32 2" stroke="#fff" stroke-width="2" fill="none" opacity="0.9"/><circle cx="6" cy="28" r="2.4" fill="#f0c869"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 34 34"><path d="M2 32 C2 14 14 2 32 2" stroke="#fff" stroke-width="2" fill="none" opacity="0.9"/><circle cx="6" cy="28" r="2.4" fill="#f0c869"/></svg></div>

    <div class="orbit-heart a">&#10084;</div>
    <div class="orbit-heart b">&#10084;</div>
    <div class="orbit-heart c">&#10084;</div>
    <div class="orbit-heart d">&#10084;</div>

    <div class="frame-inner">
      <video
        id="romanticVideo"
        autoplay
        loop
        muted
        playsinline
        preload="none"
      >
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <div class="sound-prompt" id="soundPrompt">
        <div class="sound-icon">&#128266;</div>
        <div class="sound-label">tap to hear</div>
      </div>

      <button class="mute-toggle" id="muteToggle" aria-label="Toggle sound">&#128266;</button>

      <button class="fullscreen-toggle" id="fullscreenToggle" aria-label="Fullscreen">
    ⛶
</button>
    </div>
  </div>

  <a href="continue.html" class="back-btn">←</a>

</div>


<script>
  // Generate ambient floating hearts
  const layer = document.getElementById('heartsLayer');
  const heartCount = 8;

  for (let i = 0; i < heartCount; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
   h.innerHTML = '❤️';
    const size = 12 + Math.random() * 22;
    const left = Math.random() * 100;
    const duration = 6 + Math.random() * 7;
    const delay = Math.random() * 8;
    const drift = (Math.random() * 60 - 30) + 'px';

    h.style.left = left + 'vw';
    h.style.fontSize = size + 'px';
    h.style.animationDuration = duration + 's';
    h.style.animationDelay = delay + 's';
    h.style.setProperty('--drift', drift);

    layer.appendChild(h);
  }

  // Sound handling: browsers require a real tap before audio can play
  const video = document.getElementById('romanticVideo');
  const soundPrompt = document.getElementById('soundPrompt');
  const muteToggle = document.getElementById('muteToggle');

  soundPrompt.addEventListener('click', () => {
    video.muted = false;
    video.play();
    soundPrompt.classList.add('hidden');
    muteToggle.classList.add('visible');
    muteToggle.innerHTML = '&#128266;';

    fullscreenToggle.style.display = "flex";
  });

  muteToggle.addEventListener('click', () => {
    video.muted = !video.muted;
    muteToggle.innerHTML = video.muted ? '&#128263;' : '&#128266;';
  });

  // Generate twinkling sparkles
  const sparkleCount = 20;
  for (let i = 0; i < sparkleCount; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    layer.appendChild(s);
  }

  window.addEventListener("pageshow", function () {
    const v = document.getElementById("romanticVideo");
    if (v) {
      v.pause();
      v.currentTime = 0;
    }
  });

  // ---------- Curtain open on arrival ----------
  document.addEventListener("DOMContentLoaded", () => {
    if (!document.body.classList.contains("curtain-preclosed")) return;

    requestAnimationFrame(() => {
      setTimeout(() => {
        document.body.classList.add("curtain-opening");
        document.body.classList.remove("curtain-preclosed");
      }, 350); // brief pause so the shut curtain reads before it opens
    });
  });

  const fullscreenToggle = document.getElementById("fullscreenToggle");

fullscreenToggle.addEventListener("click", () => {

    if (!document.fullscreenElement) {

        video.requestFullscreen();

        fullscreenToggle.innerHTML = "⤢";

    } else {

        document.exitFullscreen();

    }

});
document.addEventListener("fullscreenchange", () => {

    if (!document.fullscreenElement) {
        fullscreenToggle.innerHTML = "⛶";
    } else {
        fullscreenToggle.innerHTML = "⤢";
    }

});
</script>

</body>
</html>
