<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/heart.css">
</head>
<body>

  <!-- swap these filenames for your own photos -->
  <div class="bg-slideshow">
    <div class="slide" style="background-image:url('images/mainbg.jpeg')"></div>
    <div class="slide" style="background-image:url('images/photo1.jpeg')"></div>
    <div class="slide" style="background-image:url('images/photo2.jpeg')"></div>
    <div class="slide" style="background-image:url('images/photo3.jpeg')"></div>
  </div>
  <div class="overlay"></div>

  <div class="content">
    <h1 class="title">Happy Anniversary, My Lablab!</h1>
    <p class="subtitle">Another Year Down, A Lifetime To Go</p>

    <div class="cat-wrap">
      <span class="deco d1">💗</span>
      <span class="deco d2">🌸</span>
      <span class="deco d3">💐</span>
      <span class="deco d4">✨</span>

      <div class="cat">
        <div class="cat-ears">
          <span></span><span></span>
        </div>
        <div class="cat-face">
          <div class="cat-cheeks">
            <span></span><span></span>
          </div>
          <div class="cat-eyes">
            <span></span><span></span>
          </div>
          <div class="cat-mouth"></div>
        </div>
      </div>
    </div>

    <a href="heart.html" class="gift-btn">See More 🤍</a>
  </div>

</body>
</html>
