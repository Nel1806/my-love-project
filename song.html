<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>This Song Is For You</title>
<style>
  :root {
    /* ===== EDIT THESE ===== */
    /* Put files in the same folder as this html, or use full local paths */

    --bg-image: url('images/songbg.png');              /* the couple background photo */
    --vinyl-label: url('vinyl-label.jpg');  /* small label image in the center of the record */
    --video-thumb: url('video-thumb.jpg');  /* YouTube video thumbnail image */

    --message-text: "This song is for you, My love!";
    --song-title: "Minsan lang kitang Iibigin";
    --channel-name: "Justin Vasquez (Lyrics)";

    /* The actual YouTube link the card opens when clicked */
    --youtube-url: "https://www.youtube.com/watch?v=cZv0MYvK6HA&list=RDcZv0MYvK6HA&start_radio=1";
    /* ======================== */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; }

  body {
    background-color: #282a2c;
    position: relative;
    overflow: hidden;
  }

  .bg {
  position: fixed;
  inset: 0;
  z-index: -2;

  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  filter: blur(3px);
  transform: scale(1.1);
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(255, 182, 193, 0.35);
}

  .message {
    position: absolute;
    top: 8%;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: clamp(18px, 3vw, 32px);
    font-style: italic;
    font-family: 'Brush Script MT', cursive;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    letter-spacing: 0.5px;
  }
  .message::after { content: var(--message-text); }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vinyl {
    width: clamp(120px, 18vw, 220px);
    height: clamp(120px, 18vw, 220px);
    border-radius: 50%;
    background: repeating-radial-gradient(circle, #1a1a1a 0px, #1a1a1a 2px, #2b2b2b 3px, #1a1a1a 4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
    margin-right: -40px;
    z-index: 1;

  }
  .vinyl::before {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 38%;
    height: 38%;
    border-radius: 50%;
    background-image: var(--vinyl-label);
    background-size: cover;
    background-position: center;
    box-shadow: 0 0 0 3px #111;
  }
  .vinyl::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 6%;
    height: 6%;
    border-radius: 50%;
    background: #ccc;
  }

  .video-card {
    width: clamp(260px, 40vw, 460px);
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.45);
    overflow: hidden;
    z-index: 2;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }

  .video-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background-image: var(--video-thumb);
    background-size: cover;
    background-position: center;
  }

  .play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 40px;
    background: rgba(255,0,0,0.85);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn::after {
    content: "";
    border-style: solid;
    border-width: 9px 0 9px 16px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }

  .video-info {
    padding: 10px 14px 12px;
    background: #fff;
  }

  .video-title {
    font-weight: 700;
    font-size: 14px;
    color: #0f0f0f;
    line-height: 1.3;
  }
  .video-title::after { content: var(--song-title); }

  .video-channel {
    font-size: 12px;
    color: #606060;
    margin-top: 4px;
  }
  .video-channel::after { content: var(--channel-name); }

  .video-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 11px;
    color: #606060;
  }

  .yt-icon {
    width: 16px; height: 16px;
    background: red;
    border-radius: 3px;
    display: inline-block;
    position: relative;
  }
  .yt-icon::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-45%, -50%);
    border-style: solid;
    border-width: 4px 0 4px 7px;
    border-color: transparent transparent transparent #fff;
  }

  .flower {
    position: absolute;
    width: 60px;
    z-index: 3;
  }
  .flower.top-left   { top: 28%; left: 30%; }
  .flower.bottom-right { bottom: 12%; right: 18%; }

  .back-btn{
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 99999;

  width: 62px;
  height: 62px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  text-decoration: none;

  background: linear-gradient(135deg, #ff006e, #ff5ea2, #ff2e7a);

  color: #fff;
  font-size: 28px;
  font-weight: 900;

  border: 3px solid rgba(255,255,255,0.9);

  box-shadow:
    0 0 20px rgba(255,0,120,0.9),
    0 0 50px rgba(255,0,120,0.7);

  animation: pulseBtn 1.6s infinite;
}

.back-btn:hover{
  transform: translateX(-50%) scale(1.15);
}

</style>
</head>
<body>

  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="message"></div>

  <svg class="flower top-left" viewBox="0 0 100 100"><circle cx="50" cy="50" r="14" fill="#f8b6c6"/><g fill="#fdfaf2" stroke="#f8b6c6" stroke-width="2">
    <ellipse cx="50" cy="10" rx="10" ry="18"/><ellipse cx="50" cy="90" rx="10" ry="18"/>
    <ellipse cx="10" cy="50" rx="18" ry="10"/><ellipse cx="90" cy="50" rx="18" ry="10"/>
    <ellipse cx="24" cy="24" rx="10" ry="18" transform="rotate(45 24 24)"/>
    <ellipse cx="76" cy="76" rx="10" ry="18" transform="rotate(45 76 76)"/>
    <ellipse cx="24" cy="76" rx="10" ry="18" transform="rotate(-45 24 76)"/>
    <ellipse cx="76" cy="24" rx="10" ry="18" transform="rotate(-45 76 24)"/>
  </g></svg>

  <svg class="flower bottom-right" viewBox="0 0 100 100"><circle cx="50" cy="50" r="14" fill="#f6e27a"/><g fill="#fdfaf2" stroke="#f6e27a" stroke-width="2">
    <ellipse cx="50" cy="10" rx="10" ry="18"/><ellipse cx="50" cy="90" rx="10" ry="18"/>
    <ellipse cx="10" cy="50" rx="18" ry="10"/><ellipse cx="90" cy="50" rx="18" ry="10"/>
    <ellipse cx="24" cy="24" rx="10" ry="18" transform="rotate(45 24 24)"/>
    <ellipse cx="76" cy="76" rx="10" ry="18" transform="rotate(45 76 76)"/>
    <ellipse cx="24" cy="76" rx="10" ry="18" transform="rotate(-45 24 76)"/>
    <ellipse cx="76" cy="24" rx="10" ry="18" transform="rotate(-45 76 24)"/>
  </g></svg>

  <div class="stage">
    <div class="vinyl"></div>

    <a class="video-card" href="" id="videoLink" target="_blank" rel="noopener">
      <div class="video-thumb-wrap">
        <div class="play-btn"></div>
      </div>
      <div class="video-info">
        <div class="video-title"></div>
        <div class="video-channel"></div>
        <div class="video-meta">
          <span class="yt-icon"></span>
          <span>LoFi · Video</span>
        </div>
      </div>
    </a>
  </div>

  <script>
    // Pull the youtube URL from the CSS variable and apply it to the link
    const url = getComputedStyle(document.documentElement)
      .getPropertyValue('--youtube-url').trim().replace(/^"|"$/g, '');
    document.getElementById('videoLink').href = url;
  </script>

  <a href="continue.html" class="back-btn">←</a>

</body>
</html>
